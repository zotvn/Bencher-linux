[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bencher-linux"
version = "0.1.1"
description = "Local Linux gaming benchmarks with frame timing, hardware telemetry and synchronized video"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
bencher = "bencher_linux.cli:main"
bencher-linux = "bencher_linux.cli:main"

[project.urls]
Repository = "https://github.com/zotvn/Bencher-linux"
Issues = "https://github.com/zotvn/Bencher-linux/issues"

[tool.setuptools]
packages = ["bencher_linux", "bencher_linux.native"]

[tool.setuptools.package-data]
bencher_linux = ["benchmark_report.html", "native/*"]
